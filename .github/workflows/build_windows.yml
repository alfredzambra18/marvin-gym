name: Compilar Instalador Windows

on:
  push:
    tags:
      - 'v*' # Se activa solo cuando subes un tag de versión (ej. v1.0.0)

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest # GitHub usa una máquina virtual con Windows

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar con PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --collect-all customtkinter `
            --collect-all tkcalendar `
            --collect-all matplotlib `
            --hidden-import babel.numbers `
            --hidden-import pkg_resources.extern `
            --name "MarvinGym" main.py

      - name: Publicar en GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/MarvinGym.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
